<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3182f6">
<title>회의실 예약</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%85%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>

<header class="app-header">
  <div class="wrap">
    <div>
      <h1 id="appTitle">회의실 예약</h1>
      <p id="appSubtitle"></p>
    </div>
    <span class="storage-badge" id="storageBadge">불러오는 중…</span>
  </div>
</header>

<main class="wrap">
  <a class="mode-banner" id="modeBanner" href="./setup.html" hidden>
    <span class="mode-banner-mark">!</span>
    <span class="mode-banner-text">
      <b>지금은 시험 모드예요</b>
      예약이 이 기기에만 저장돼서 다른 부서에는 보이지 않습니다. 눌러서 공유 설정을 마쳐주세요.
    </span>
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>

  <section class="card">
    <div class="cal-nav">
      <div class="cal-month" id="calMonth"></div>
      <button class="chip-btn" id="btnToday" type="button">오늘</button>
      <button class="icon-btn" id="btnPrev" type="button" aria-label="이전 달">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="btnNext" type="button" aria-label="다음 달">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <div>
        <h2 id="dayTitle">날짜를 선택하세요</h2>
        <p id="daySummary"></p>
      </div>
    </div>
    <div class="tl-head" id="tlHead"></div>
    <div class="tl-body" id="tlBody"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2 id="listTitle">예약 내역</h2>
      <button class="link-btn" id="btnExport" type="button">이번 달 내보내기</button>
    </div>
    <div class="res-list" id="resList"></div>
  </section>

  <p class="notice" id="notice" hidden></p>
</main>

<div class="fab-bar">
  <div class="wrap">
    <button class="btn-primary" id="btnNew" type="button">＋ 예약하기</button>
  </div>
</div>

<!-- 예약 입력 -->
<div class="overlay" id="formOverlay">
  <form class="sheet" id="bookForm" novalidate>
    <div class="sheet-handle"></div>
    <h3>회의실 예약</h3>
    <p class="desc">비어 있는 시간에만 예약할 수 있어요.</p>

    <div class="field">
      <label>회의실</label>
      <div class="seg" id="roomSeg"></div>
    </div>

    <div class="field">
      <label for="fDate">날짜</label>
      <input class="input" type="date" id="fDate" required>
    </div>

    <div class="row-2">
      <div class="field">
        <label for="fStart">시작 시간</label>
        <select class="input" id="fStart"></select>
      </div>
      <div class="field">
        <label for="fEnd">종료 시간</label>
        <select class="input" id="fEnd"></select>
      </div>
    </div>

    <div class="row-2">
      <div class="field">
        <label for="fDept">부서명</label>
        <input class="input" type="text" id="fDept" list="deptList" placeholder="예) 총무팀" required>
        <datalist id="deptList"></datalist>
      </div>
      <div class="field">
        <label for="fPerson">예약자</label>
        <input class="input" type="text" id="fPerson" placeholder="예) 홍길동" required>
      </div>
    </div>

    <div class="field">
      <label for="fPurpose">사용 목적 <span class="opt">(선택)</span></label>
      <input class="input" type="text" id="fPurpose" placeholder="예) 월간 업무회의">
    </div>

    <div class="field">
      <label for="fContact">연락처 <span class="opt">(선택)</span></label>
      <input class="input" type="text" id="fContact" inputmode="tel" placeholder="예) 내선 1234">
    </div>

    <div class="field">
      <label for="fPin">취소 비밀번호 (숫자 4자리)</label>
      <input class="input" type="password" id="fPin" inputmode="numeric" autocomplete="off"
             maxlength="4" pattern="[0-9]{4}" placeholder="예약을 취소할 때 필요해요" required>
    </div>

    <div class="sheet-actions">
      <button type="button" class="btn-ghost" id="btnFormCancel">닫기</button>
      <button type="submit" class="btn-primary" id="btnFormSubmit">예약하기</button>
    </div>
  </form>
</div>

<!-- 예약 취소 -->
<div class="overlay" id="cancelOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3>예약을 취소할까요?</h3>
    <p class="desc">예약할 때 입력한 비밀번호가 필요해요.</p>
    <div class="summary-box" id="cancelSummary"></div>
    <div class="field">
      <label for="cPin">비밀번호</label>
      <input class="input" type="password" id="cPin" inputmode="numeric" autocomplete="off"
             maxlength="4" placeholder="숫자 4자리">
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn-ghost" id="btnKeep">돌아가기</button>
      <button type="button" class="btn-danger" id="btnConfirmCancel">예약 취소</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="./assets/app.js"></script>
</body>
</html>
